[package]
name = "focusd-island-host"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[build-dependencies]
serde_json = "1"
serde_yaml = "0.9"

[dependencies]
env_logger = "0.11"
log = "0.4"
nsh-base = "0.6.1"
nsh-platform-windows = { version = "0.6.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg", "net"] }
nsh-app-focusd-island-nsh = { path = "..", features = ["embedded"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
