[package]
name = "nsh-app-focusd-island-nsh"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
embedded = []

[workspace]

[dependencies]
nsh-core = "0.6.1"
nsh-base = "0.6.1"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusty-leveldb = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
pollster = "0.4"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
flate2 = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.6.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg", "net", "sound"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.6.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.6.1", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "websocket", "updater", "svg", "net"] }
windows = { version = "0.62", features = ["Foundation", "Media", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_Globalization", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
